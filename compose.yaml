# Запуск всех компонентов одной командой:
#   docker compose up -d --build
# Открыть: http://localhost:8000
#
# Все три модели доступны через единый API-прокси организаторов.
# Адрес, ключ и идентификаторы моделей — в окружении или .env (шаблон — .env.example):
#   LLM_BASE_URL, LLM_API_KEY, LLM_MODEL, EMB_MODEL, RERANKER_MODEL

services:
  # Веб-интерфейс: FastAPI + ядро ассистента + собранный фронт
  web:
    build: .
    image: psb-legal-assistant-web
    ports:
      - "${WEB_HOST_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Фиксируем порт внутри контейнера, чтобы локальный WEB_PORT из .env не ломал внутренний роутер
      WEB_PORT: "8000"
      # Окружение запуска важнее .env; все модели вызываются ядром напрямую через этот прокси.
      LLM_BASE_URL: ${LLM_BASE_URL:-${BASE_URL:-${OPENAI_BASE_URL:-}}}
      LLM_API_KEY: ${LLM_API_KEY:-${OPENAI_API_KEY:-}}
      LLM_MODEL: ${LLM_MODEL:-${GEN_MODEL:-${OPENAI_MODEL:-}}}
      EMB_MODEL: ${EMB_MODEL:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      EMBEDDER_API_KEY: ${EMBEDDER_API_KEY:-}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      # Не использовать старые адреса локальных моделей из .env.
      EMB_BASE_URL: ""
      RERANK_BASE_URL: ""
      DATA_DIR: /app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    stop_grace_period: 10s
    restart: unless-stopped
